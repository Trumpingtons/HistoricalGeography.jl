# The journey of Afanasy Nikitin, a merchant of Tver, beyond three seas, as he wrote it: down the Volga, where the
# Tatars robbed him below Astrakhan, to Derbent and Baku, across Persia to Hormuz, by sea to Chaul in India, where he
# lived some four years in the Deccan, at Junnar, Bidar, Pervota and Kulburga, and back by Dabul, Muscat, Hormuz,
# Persia and Trebizond across the Black Sea to Kaffa. Each stage has his words in Count Wielhorsky's translation, The
# Travels of Athanasius Nikitin, of Twer, in R. H. Major's India in the Fifteenth Century (Hakluyt Society, 1857),
# taken from the scan of the University of California's copy at the Internet Archive and read against a second scan,
# Brandeis University's; the errors of the scans' text are corrected. The last stage, Smolensk, has the words of the
# edition's introduction, as Nikitin's own narrative ends at Kaffa.
# Nikitin dates his stages by the Christian and Muslim feasts, not by years, so no stage has a year: the introduction
# of the edition puts the journey from 1468 to 1474, and later scholars date it otherwise. Places the narrative names
# only in passing, or that cannot be told for certain, are left out: Chebokhara, which the translation reads as
# Bokhara although Nikitin puts it in Mazanderan, Kulongher, Kowrooh, the orda of Uzun Hasan and Arzizin.
# Each place has its Wikidata item, from which its coordinates come.

