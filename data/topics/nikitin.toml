[[stages]]
place = "tver"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "This is, as I wrote it, my sinful wandering beyond the three seas: the first, the sea of Derbend / the second, the India Sea / the third, the Black Sea / I started from the church of our holy Saviour of Zlatoverkh, with the kind permission of the Grand-Duke Michael Borissowich and the bishop Gennadius of Twer"

[[stages]]
place = "kalyazin"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "went down the Volga, came to the convent of the holy life-giving Trinity, and the holy shrines of Boris and Gleb the martyrs; and received the blessing of the hegumen Macarius and the brethren."

[[stages]]
place = "uglich"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "From Koliazin I went to Ooglich"

[[stages]]
place = "kostroma"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "thence to Kostromah, to the Kniaz Alexander, with an epistle."

[[stages]]
place = "nizhny"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "I went on by Plesso to Nijni-Novgorod, to the namestnik Michael Kisseleff, and to Iwan Saraeff, the collector of duties, both of whom let me pass freely. / I stopped a fortnight to wait for the Tartar ambassador of Shirvanshah"

[[stages]]
place = "kazan"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "With him I descended the Volga. We passed unmolested through Kazan, the Orda, Ooslan, Sarai, and Berekezany, and we entered the river Buzan."

[[stages]]
place = "astrakhan"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "I abandoned my boat and crept into the ambassador's with my companions, and we sailed by Astrakhan at moonlight. / In the larger we reached the sea, but having grounded at the mouth of the Volga we were taken"

[[stages]]
place = "derbent"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "And so we went on to Derbend in two boats / A storm having arisen at sea, the smaller boat was wrecked on shore. Then came the Kaitaks and made the whole party prisoners"

[[stages]]
place = "baku"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "As for me, I went to Derbend and then to Bakou, where the fire burns unextinguished"

[[stages]]
place = "sari"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "one month I lived at Sareh, in the land of Mazanderan"

[[stages]]
place = "amol"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "and one month at Amyl (Amol)."

[[stages]]
place = "damavand"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "Then I went to Dimovand (Demowend)"

[[stages]]
place = "rey"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "and from Demowend to Orey"

[[stages]]
place = "kashan"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "to Kashan, where I remained one month."

[[stages]]
place = "nain"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "I also spent a month at Nain"

[[stages]]
place = "yazd"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "and another at Yezd."

[[stages]]
place = "lar"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "and from Tarem to Lar, and from Lar to Bender (Bunder Abbas); and here there is a seaport, Hormyz (Hormuz)"

[[stages]]
place = "hormuz"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "Hormuz is four miles across the water and stands on an island. Twice a day the sea flows around it / At Hormuz the sun is scorching and burns man. I stopped there a month."

[[stages]]
place = "chaul"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "We sailed six weeks in the tava till we reached Chivil / This is an Indian country. / When I go out many people follow me, and stare at the white man."

[[stages]]
place = "junnar"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "And I, poor sinner, brought a stallion to the land of India; with God's help I reached Jooneer all well, but it cost me a hundred roubles. / At Jooneer the khan took away my horse, and having heard that I was no Mahommedan, but a Russian"

[[stages]]
place = "bidar"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "Beder is the chief town of the whole of Mahomedan Hindostan; the city is large, and contains a great many people. / I sold my stallion at Beder, and got by him 60 and 8 footoons, having kept him a whole year."

[[stages]]
place = "pervota"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "Having spent four months at Beder, I agreed with some Hindoos to go to Pervota, which is their Jerusalem / We were a month on the route. A fair is held there during five days."

[[stages]]
place = "bidar"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "From Pervota we returned to Beder, a fortnight before the great Mahommedan festival (Ulu Bairam)."

[[stages]]
place = "kulburga"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "On the fifth great day I thought of returning to Russia, and I set out from Beder a month before the Mahommedan Bairam. / I kept Lent time with the Mussulmans and broke fasting with them on Easter day, which I did at Kulburga"

[[stages]]
place = "dabul"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "Dabul, a port of the vast Indian Sea. It is a very large town, the great meeting-place for all nations living along the coast of India and of Ethiopia. / So I embarked in a tava, and settled to pay for my passage to Hormuz two pieces of gold."

[[stages]]
place = "muscat"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "From thence I reached Muscat in twelve days; and there I held the sixth great holiday."

[[stages]]
place = "hormuz"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "Nine days journey brought me to Hormuz, where I stayed twenty days."

[[stages]]
place = "lar"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "From Hormuz I proceeded thus: First to Lar, where I stopped three days"

[[stages]]
place = "shiraz"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "then in twelve days from Lar to Shiraz, stopped there seven days"

[[stages]]
place = "yazd"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "in nine days from Velergh to Yezd, stopped there eight days"

[[stages]]
place = "isfahan"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "in five days from Yezd to Ispahan, stopped there six days"

[[stages]]
place = "kashan"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "from Ispahan to Kashan, where I stopped five days"

[[stages]]
place = "tabriz"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "from Kashan I went by Koom, Sava, Sultania, Tabreez, and came to the orda of Assanbek. There I spent ten days, as there was no road further on."

[[stages]]
place = "trebizond"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "thence to Trebizond, where I arrived on the festival of the Protection of our Lady the holy Virgin Mary. / I was very much annoyed at Trebizond by the pasha / it was searched, especially for writings, as I was coming from the orda of Assanbek."

[[stages]]
place = "kaffa"
cite = "The Travels of Athanasius Nikitin, of Twer"
passage = "At last, with God's blessing, I reached Caffa, nine days before the fast of St. Philip. / through the mercy of God I have crossed three seas"

[[stages]]
place = "smolensk"
cite = "India in the Fifteenth Century, introduction, page lxxix"
passage = "The chronicler only remarks that, in the year he obtained the description of Nikitin's travels (1475), it was reported that he (Nikitin) had died before he reached Smolensk."
