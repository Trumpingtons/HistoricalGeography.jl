# The North West Passage of Roald Amundsen in the Gjøa, 1903 to 1906, as he tells it in The North West Passage
# (1908): from Christiania by Godhavn, Dalrymple Rock and Beechey Island to Gjøa Haven on King William Land, where he
# wintered twice; through Simpson Strait and the unsailed waters to Cape Colborne and on to Nelson Head, where the
# first whaler came in sight; a third winter at King Point, from which he went by Herschel Island and Fort Yukon to
# the telegraph at Eagle City and back; and on by Point Barrow and Bering Strait to Nome. The three parts are the
# voyage to King Point, the journey to Eagle City and the voyage to Nome. Each stage has his words, taken from the
# scan of the University of Toronto's copy at the Internet Archive and read against a second scan of each volume;
# the errors of the scans' text are corrected. The dates are those Amundsen gives: Godhavn is the day after July
# 24th, Nome the day after August 30th, and Eagle City and Point Barrow, which he does not date, have their year.
# Each place has its Wikidata item, from which its coordinates come.

