[[stages]]
place = "gizeh"
year = 1880
cite = "Chapter I, The Pyramids of Gizeh, 1881-2"
passage = "When, in the end of 1880, I first started for Egypt, I had long been preparing for the expedition / As an English engineer had left a tomb fitted with door and shutters I was glad to get such accommodation."
summary = "Two years measuring the pyramids, living in a rock tomb."

[[stages]]
place = "tanis"
year = 1884
cite = "Chapter II, Tanis, 1884"
passage = "A preliminary exploring trip was made to several places in the Delta, in course of which I discovered Naukratis; and as soon as the marshes had somewhat dried I went in February to Tanis."
summary = "His first excavation for the Egypt Exploration Fund."

[[stages]]
place = "naukratis"
year = 1885
cite = "Chapter III, Naukratis, 1885"
passage = "Before me lay a long low mound of town ruins, of which all the core had been dug out by the natives for earth, thus baring the very lowest level of the town all over the middle of it. / All that day ‘Naukratis’ rang in my mind, and I sprang over the mounds with that splendid exultation of a new discovery, long wished for and well found."
note = "Petrie found the site before going to Tanis in 1884, and dug it in 1885."

[[stages]]
place = "nebesheh"
year = 1886
cite = "Chapter V, Nebesheh, 1886"
passage = "The site, Tell Nebesheh, is a very out-of-the-way spot / After leaving Naukratis I went to this place, to try to clear up its history"

[[stages]]
place = "daphnae"
year = 1886
cite = "Chapter IV, Daphnae—Tahpanhes, 1886"
passage = "After working at Tell Nebesheh for some time, I left it in Mr. Griffith’s hands, and told my men that I wanted to work at Defneh; immediately I had more volunteers than I could employ, and I went into the desert to the work with a party of forty,--men, boys and girls,--and formed a settlement which enlarged up to seventy."

[[stages]]
place = "minia"
year = 1887
cite = "Chapter VI, Up the Nile, 1887"
passage = "We hired a small boat with a cabin at Minia, and took six weeks wandering up to Assuan, walking most of the way in and out of the line of cliffs."

[[stages]]
place = "assuan"
year = 1887
cite = "Chapter VI, Up the Nile, 1887"
passage = "Assuan proved a most interesting district, teeming with early inscriptions cut on the rocks; and to copy all of these was a long affair."

[[stages]]
place = "thebes"
year = 1887
cite = "Chapter VI, Up the Nile, 1887"
passage = "At Thebes my main work was in obtaining casts and photographs of all the types of foreign races on the monuments."

[[stages]]
place = "dahshur"
year = 1887
cite = "Chapter VI, Up the Nile, 1887"
passage = "Having finished the Theban work, I then went to Dahshur, and there made a survey around the two large pyramids"

[[stages]]
place = "arsinoe"
year = 1888
cite = "Chapter VII, Hawara, 1888"
passage = "For this purpose I needed to recruit a party from a little distance, and began my work therefore at the ancient Arsinoe or Crocodilopolis, close to Medinet el Fayum."

[[stages]]
place = "hawara"
year = 1888
cite = "Chapter VII, Hawara, 1888"
passage = "Having by this time formed and organised a good body of workmen, I moved over to Hawara, with as many men as I wanted / when one day a mummy was found, with a painted portrait on a wooden panel placed over its face."
summary = "The pyramid of Amenemhat III, and the Roman cemetery of the mummy portraits."

[[stages]]
place = "gurob"
year = 1889
cite = "Chapter IX, Gurob, 1889-90"
passage = "I soon went to see it, and found that it was an early site unmixed with any later remains. / In the beginning of 1889 I worked out part of the town"

[[stages]]
place = "illahun"
year = 1889
cite = "Chapter VIII, Illahun, 1889-90"
passage = "Having finished opening the pyramid of Hawara, the next attraction was that of Illahun, a few miles to the east of it, in the Nile valley, at the entrance to the Fayum."

[[stages]]
place = "kahun"
year = 1889
cite = "Chapter VIII, Illahun, 1889-90"
passage = "it dawned on me that this could hardly be other than the town of the pyramid builders, originally called Ha-Usertesen-hotep, and now known as Kahun."

[[stages]]
place = "medum"
year = 1891
cite = "Chapter X, Medum, 1891"
passage = "I called together a selected lot of my old workers from Illahun, and we went over and made a camp at the cemetery of Medum; there we lived over four months, and I unravelled what could be traced on the questions that await us."
