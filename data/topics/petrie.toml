# The excavations of W. M. Flinders Petrie in Egypt from 1880 to 1891, as he tells them in Ten Years' Digging in Egypt
# (1892), whose chapters follow his seasons, each with its year: the survey of the pyramids of Gizeh, the sites of the
# Delta for the Egypt Exploration Fund, a journey up the Nile copying inscriptions, and the pyramids, towns and
# cemeteries of the Fayum and Medum. Each stage is a site in the order he worked it, with the year of his season and
# his words. Each place has its Wikidata item, from which its coordinates come.

