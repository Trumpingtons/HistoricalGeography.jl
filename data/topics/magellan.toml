# The voyage of Ferdinand Magellan, 1519 to 1522, the first round the world, as Antonio Pigafetta, who sailed with
# him, tells it in his relation, in the translation of James Alexander Robertson, Magellan's Voyage Around the World
# (1906): from Seville and San Lucar by Tenerife to the land of Verzin and the port of Santo Julianno, through the
# strait from the cape of the Eleven Thousand Virgins to the Pacific, across it to the islands of Ladroni and the
# Philippines, where Magellan was killed at Matan, and on, without him, by Burne to Tadore in the Moluccas, Timor,
# the cape of Good Hope and the Cape Verde Islands, back to San Lucar and Seville. Each stage has Pigafetta's words,
# taken from the scan of the volumes at the Internet Archive, the English beside the Italian of the Ambrosian
# manuscript, without the marks of Robertson's notes; the errors of the scan's text are corrected. The dates are
# those Pigafetta gives (August x and September xx, as printed, are August 10th and September 20th); a stage he does
# not date has its year. Each place has its Wikidata item, from which its coordinates come.

title = "The Voyage of Magellan"
