# The journeys of John Lewis (Johann Ludwig) Burckhardt from 1812 to 1815, as his journals tell them in the three
# books published after his death by the African Association: Travels in Syria and the Holy Land (1822), his journey
# of 1812 from Damascus through Arabia Petraea to Cairo, by Wady Mousa, the ruins of Petra; Travels in Nubia (1819),
# his journey of 1813 up the Nile from Assouan to Mahass, back by the temples of Ebsambal (Abu Simbel), and his journey
# of 1814 with a caravan of slave traders across the desert to Berber and Shendy, and on to Souakin on the Red Sea; and
# Travels in Arabia (1829), his stay in the Hedjaz in 1814 and 1815, at Mekka and Medina as a Muslim pilgrim. Each
# journey is a part of its own, and each stage is a place of the journals with its date and Burckhardt's words; the
# places keep his spelling, with today's names in brackets. Each place has its Wikidata item, from which its
# coordinates come.
#
# The texts: Travels in Syria and the Holy Land, https://www.gutenberg.org/ebooks/8884; Travels in Nubia,
# https://archive.org/details/travelsinnubia00burc; Travels in Arabia, https://www.gutenberg.org/ebooks/9457.

