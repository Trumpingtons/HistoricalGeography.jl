# Places of Kalidasa's Meghaduta, The Cloud-Messenger, in which an exiled Yaksha sends a cloud from Rama's peak in
# central India north over Vidisha and Ujjain, the field of the epic battles and the Ganges to Mount Kailasa and the
# city of Alaka, in the order of the poem, each with its stanzas in Arthur W. Ryder's translation (1912), from
# Project Gutenberg's text, and with Ryder's analysis of the stanza, in italics in his book, where it names the
# place. The places are those Ryder names or explains: Rama's peak, which he puts "probably one near the modern
# Nagpore", is placed at Ramtek, the field where Arjuna fought at Kurukshetra, and Alaka, "the city of the Yakshas"
# on Kailasa, at Mount Kailash. Places that cannot be told for certain from his translation, such as the Mala
# plateau, the Mango Peak, Nichais' mountain, Holy Peak and the Ten Cities, are left out, as are the rivers.
# Each place has its Wikidata item, from which its coordinates come.

