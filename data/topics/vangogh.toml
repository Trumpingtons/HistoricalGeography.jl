# The last years of Vincent van Gogh, from his arrival in Paris in March 1886 to his death at Auvers-sur-Oise in July
# 1890, as his letters tell them: Paris, Arles and the Provence around it, the asylum at Saint-Rémy, Paris again and
# Auvers. Each stage is a place a letter is written from or tells of, with a passage of the letter in the language he
# wrote it in, French or Dutch, as Jo van Gogh-Bonger printed it in Brieven aan zijn broeder (1914), with a short
# English summary; the letters are numbered as in that edition. The stages have the date of the letter that tells them,
# as the edition of the letters at WebExhibits dates it, or its year where that is a span of days; the date of his
# arrival in Paris in May 1890 is Jo van Gogh-Bonger's, in her introduction to the first volume. Each stage has a
# painting of that place and time, his own, or one a letter names, with its image at Wikimedia Commons. Each place has
# its Wikidata item, from which its coordinates come.
#
# The texts: Brieven aan zijn broeder, volume 3 (Wereldbibliotheek, 1914),
# https://archive.org/details/brievenaanzijnbr03gogh, and volume 1, https://archive.org/details/brievenaanzijnbr01gogh;
# the dates, https://www.webexhibits.org/vangogh/.

title = "The Last Years of Vincent van Gogh"
