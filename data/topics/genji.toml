[[mentions]]
place = "palace"
cite = "Chapter 1, Kiritsubo"
passage = "内裏より御使あり。三位の位贈りたまふよし、勅使来てその宣命読むなむ、悲しきことなりける。"
summary = "A messenger comes from the Palace: the Emperor gives the dead Kiritsubo lady the third rank, and his envoy reads the decree, a sorrowful thing."

[[mentions]]
place = "nonomiya"
cite = "Chapter 10, Sakaki"
passage = "野の宮に参うでたまふ。 / 遥けき野辺を分け入りたまふより、いとものあはれなり。"
summary = "Genji goes to the shrine of Nonomiya; from the moment he makes his way into the wide moor, all is full of melancholy."

[[mentions]]
place = "ise"
cite = "Chapter 10, Sakaki"
passage = "鈴鹿川八十瀬の波に濡れ濡れず伊勢まで誰れか思ひおこせむ"
summary = "The Rokujō lady's answer to Genji, from beyond the barrier: whether or not my sleeves are wet in the many shallows of the Suzuka River, who will think of me as far as Ise?"

[[mentions]]
place = "suma"
cite = "Chapter 12, Suma"
passage = "かの須磨は、昔こそ人の住みかなどもありけれ、今は、いと里離れ心すごくて、海人の家だにまれに"
summary = "Suma, Genji hears, had dwellings once, but is now far from any village and desolate, with hardly even a fisherman's hut."

[[mentions]]
place = "akashi"
cite = "Chapter 13, Akashi"
passage = "明石の浦より、前の守新発意の、御舟装ひて参れるなり。"
summary = "The former governor, now a lay monk, has come with a boat from the bay of Akashi."

[[mentions]]
place = "sumiyoshi"
cite = "Chapter 14, Miotsukushi"
passage = "その秋、住吉に詣でたまふ。願ども果たしたまふべければ、いかめしき御ありきにて、世の中ゆすりて、上達部、殿上人、我も我もと仕うまつりたまふ。"
summary = "That autumn Genji goes on pilgrimage to Sumiyoshi to fulfil his vows, in a great procession that stirs the whole world, nobles and courtiers vying to attend him."

[[mentions]]
place = "osaka"
cite = "Chapter 16, Sekiya"
passage = "逢坂の関やいかなる関なればしげき嘆きの仲を分くらむ"
summary = "Utsusemi's poem: what barrier is the Ōsaka Barrier, that it parts two who grieve so much?"

[[mentions]]
place = "ishiyama"
cite = "Chapter 16, Sekiya"
passage = "関入る日しも、この殿、石山に御願果しに詣でたまひけり。"
summary = "On the very day that her party comes through the barrier, Genji goes to Ishiyama to fulfil a vow."

[[mentions]]
place = "oi"
cite = "Chapter 18, Matsukaze"
passage = "昔、母君の御祖父、中務宮と聞こえけるが領じたまひける所、大堰川のわたりにありけるを"
summary = "The Akashi novice remembers an estate by the Ōi River, long left to ruin, that his wife's grandfather, a Prince of the Ministry of Central Affairs, had owned."

[[mentions]]
place = "sagano"
cite = "Chapter 18, Matsukaze"
passage = "嵯峨野の御堂にも、飾りなき仏の御訪らひすべければ、二、三日ははべりなむ"
summary = "Genji tells Murasaki that he must also see to the unadorned Buddha of his chapel at Sagano, and will be away two or three days."

[[mentions]]
place = "tsukushi"
cite = "Chapter 22, Tamakazura"
passage = "かの若君の四つになる年ぞ、筑紫へは行きける。"
summary = "In the year the little girl turned four, her nurse's family went down to Tsukushi."

[[mentions]]
place = "hatsuse"
cite = "Chapter 22, Tamakazura"
passage = "仏の御なかには、初瀬なむ、日の本のうちには、あらたなる験現したまふと、唐土にだに聞こえあむなり。 / 前より行く水をば、初瀬川といふなりけり。"
summary = "Of all the Buddhas in Japan, Hatsuse shows the most wondrous signs, as even China has heard; the stream that flows before the temple is the Hatsuse River."

[[mentions]]
place = "oharano"
cite = "Chapter 29, Miyuki"
passage = "その師走に、大原野の行幸とて、世に残る人なく見騒ぐを、六条院よりも、御方々引き出でつつ見たまふ。"
summary = "That twelfth month the Emperor goes in procession to Ōharano; no one stays behind, and the ladies of the Rokujō mansion come out to watch."

[[mentions]]
place = "uji"
cite = "Chapter 45, Hashihime"
passage = "宇治といふ所に、よしある山里持たまへりけるに渡りたまふ。"
summary = "His palace burnt, the Eighth Prince moves to a fine mountain village he owns at a place called Uji."

[[mentions]]
place = "yokawa"
cite = "Chapter 53, Tenarai"
passage = "そのころ、横川に、なにがし僧都とか言ひて、いと尊き人住みけり。"
summary = "At that time a most venerable man, a bishop of some name, lived at Yokawa."
