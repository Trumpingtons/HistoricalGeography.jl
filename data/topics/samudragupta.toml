passage = "whose binding together of the (whole) world, by means of the amplitude of the vigour of (his) arm, was effected by the acts of respectful service, such as offering themselves as sacrifices, bringing presents of maidens, (giving) Garuda-tokens, (surrendering) the enjoyment of their own territories, soliciting (his) commands, &c., (rendered) by the Daivaputras, Shahis, Shahanushahis, Sakas, and Murundas, and by the people of Simhala and all (other) dwellers in islands"
