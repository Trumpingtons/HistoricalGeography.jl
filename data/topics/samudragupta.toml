# The conquests of Samudragupta, Gupta emperor of the fourth century, as his pillar inscription at Allahabad tells
# them, in the translation of John Faithfull Fleet, Corpus Inscriptionum Indicarum, volume III (1888), number 1,
# taken from the scan of a copy at the Internet Archive; the errors of the scan's text are corrected, and the names
# are written without Fleet's diacritics. The inscription gives no years, so the events are in its order: the Kota
# prince captured and the king at Pushpa (line 13), the kings of the south captured and then set free (line 19), the
# frontier kings who paid him taxes and obeisance (line 22), and the people of Simhala who served him (line 23).
# Pushpa is Pushpapura, a name of Pataliputra, as Fleet takes it, though he notes that Kanauj was also once called
# Kusumapura. Only the places that are known for certain are on the map: Kosala, Mahakantara, Kerala, Kottura,
# Erandapalla, Avamukta, Palakka, Devarashtra, Kusthalapura, Davaka, Kartripura and the kings of Aryavarta whom he
# exterminated, whose cities the inscription does not name, are left out, as are the tribes.
# Each place has its Wikidata item, from which its coordinates come.

title = "The Conquests of Samudragupta"
work = "The Allahabad pillar inscription of Samudragupta, translated by John Faithfull Fleet, Corpus Inscriptionum Indicarum, volume III: Inscriptions of the Early Gupta Kings and Their Successors (1888), number 1"
text = "https://archive.org/details/dli.csl.8714"
licence = "Public domain (text)"

