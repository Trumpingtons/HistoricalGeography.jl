# The journey of the monk Faxian (Fâ-Hien) from Chang'an to India in search of the Books of Discipline, 399 to 414, as
# he wrote it in his Record of Buddhistic Kingdoms: across the Sandy Desert to Khotan, over the Onion mountains into
# North India, down the Indus to Peshawar and Nagara, across the Little Snowy mountains, through Central India to the
# places of the Buddha's life, three years at Pataliputra and two at Tamalipti, two years in Ceylon, and home by sea,
# by way of Java, to the coast of Shandong and Nanking. Each stage has his words in James Legge's translation (1886),
# from Project Gutenberg's text, without the marks of Legge's notes.
# Faxian dates his journey by its summer retreats and by the length of his stays, so the years of the stages are
# approximate: those of Legge's notes where he gives one (399 at the start, 400 at Chang-yih, 402 in Udyana, 404 at
# Lo-e, 413 at Ts'ing-chow, 414 for the narrative), and counted from Faxian's own words between them. The places Legge
# leaves unidentified are left out: Shen-shen, Tsze-hoh, Yu-hwuy, K'eeh-ch'a, Lo-e, Bhida and Java-dvipa; Woo-e is
# placed at Karasahr, and T'o-leih in the Darel valley, as Legge's notes say others have put them. Places the text
# gives no stage of their own, such as Gandhara and Sha-che, are left out too.
# Each place has its Wikidata item, from which its coordinates come.

