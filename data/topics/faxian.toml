[[stages]]
place = "changan"
year = 399
cite = "A Record of Buddhistic Kingdoms, chapter I"
passage = "Fâ-Hien had been living in Ch’ang-gan. / After starting from Ch’ang-gan, they passed through Lung, and came to the kingdom of K’een-kwei, where they stopped for the summer retreat."

[[stages]]
place = "zhangye"
year = 400
cite = "A Record of Buddhistic Kingdoms, chapter I"
passage = "When that was over, they went forward to the kingdom of Now-t’an, crossed the mountain of Yang-low, and reached the emporium of Chang-yih. There they found the country so much disturbed that travelling on the roads was impossible for them. Its king, however, was very attentive to them, kept them (in his capital), and acted the part of their danapati."

[[stages]]
place = "dunhuang"
year = 400
cite = "A Record of Buddhistic Kingdoms, chapter I"
passage = "Le Hao, the prefect of T’un-hwang, had supplied them with the means of crossing the desert (before them), in which there are many evil demons and hot winds. (Travellers) who encounter them perish all to a man. There is not a bird to be seen in the air above, nor an animal on the ground below."

[[stages]]
place = "wooe"
year = 400
cite = "A Record of Buddhistic Kingdoms, chapter II"
passage = "Here they stayed for about a month, and then proceeded on their journey, fifteen days walking to the north-west bringing them to the country of Woo-e. In this also there were more than four thousand monks, all students of the hinayana."
note = "Legge leaves Woo-e unidentified, and quotes Watters: “We cannot be far wrong if we place it in Kharaschar, or between that and Kutscha.”"

[[stages]]
place = "khotan"
year = 401
cite = "A Record of Buddhistic Kingdoms, chapters II and III"
passage = "in the course of a month and five days they succeeded in reaching Yu-teen. / Yu-teen is a pleasant and prosperous kingdom, with a numerous and flourishing population. / Fâ-Hien and the others, wishing to see the procession of images, remained behind for three months."

[[stages]]
place = "toleih"
year = 402
cite = "A Record of Buddhistic Kingdoms, chapter VI"
passage = "When (the travellers) had got through them, they were in North India, and immediately on entering its borders, found themselves in a small kingdom called T’o-leih, where also there were many monks, all students of the hinayana."
note = "Legge doubts that T’o-leih is Darada, as Eitel and others hold, and quotes Cunningham: “Darel is a valley on the right or western bank of the Indus.”"

[[stages]]
place = "udyana"
year = 402
cite = "A Record of Buddhistic Kingdoms, chapter VIII"
passage = "After crossing the river, (the travellers) immediately came to the kingdom of Woo-chang, which is indeed (a part) of North India. / Fâ-Hien and the others remained in Woo-chang, and kept the summer retreat."

[[stages]]
place = "taxila"
year = 402
cite = "A Record of Buddhistic Kingdoms, chapter XI"
passage = "Seven days’ journey from this to the east brought the travellers to the kingdom of Takshasila, which means “the severed head” in the language of China."

[[stages]]
place = "peshawar"
year = 403
cite = "A Record of Buddhistic Kingdoms, chapter XII"
passage = "Going southwards from Gandhara, (the travellers) in four days arrived at the kingdom of Purushapura. / Of all the topes and temples which (the travellers) saw in their journeyings, there was not one comparable to this in solemn beauty and majestic grandeur."

[[stages]]
place = "hadda"
year = 403
cite = "A Record of Buddhistic Kingdoms, chapter XIII"
passage = "Going west for sixteen yojanas, he came to the city He-lo in the borders of the country of Nagara, where there is the flat-bone of Buddha’s skull, deposited in a vihâra adorned all over with gold-leaf and the seven sacred substances."

[[stages]]
place = "safedkoh"
year = 404
cite = "A Record of Buddhistic Kingdoms, chapter XIV"
passage = "Having stayed there till the third month of winter, Fâ-Hien and the two others, proceeding southwards, crossed the Little Snowy mountains. On them the snow lies accumulated both winter and summer. / Hwuy-king could not go any farther. A white froth came from his mouth, and he said to Fâ-Hien, “I cannot live any longer. Do you immediately go away, that we do not all die here;” and with these words he died."

[[stages]]
place = "bannu"
year = 404
cite = "A Record of Buddhistic Kingdoms, chapter XIV"
passage = "Here they stayed for the summer retreat, and when that was over, they went on to the south, and ten days’ journey brought them to the kingdom of Poh-na, where there are also more than three thousand monks, all students of the hinayana."

[[stages]]
place = "mathura"
year = 404
cite = "A Record of Buddhistic Kingdoms, chapter XVI"
passage = "After passing all these places, they came to a country named Ma-t’aou-lo. They still followed the course of the P’oo-na river, on the banks of which, left and right, there were twenty monasteries, which might contain three thousand monks; and (here) the Law of Buddha was still more flourishing."

[[stages]]
place = "sankasya"
year = 405
cite = "A Record of Buddhistic Kingdoms, chapter XVII"
passage = "From this they proceeded south-east for eighteen yojanas, and found themselves in a kingdom called Sankasya, at the place where Buddha came down, after ascending to the Trayastrimsas heaven, and there preaching for three months his Law for the benefit of his mother."

[[stages]]
place = "kannauj"
year = 405
cite = "A Record of Buddhistic Kingdoms, chapter XVIII"
passage = "Fâ-Hien stayed at the Dragon vihâra till after the summer retreat, and then, travelling to the south-east for seven yojanas, he arrived at the city of Kanyakubja, lying along the Ganges."

[[stages]]
place = "sravasti"
year = 405
cite = "A Record of Buddhistic Kingdoms, chapter XX"
passage = "Going on from this to the south, for eight yojanas, (the travellers) came to the city of Sravasti in the kingdom of Kosala / When Fâ-Hien and Tao-ching first arrived at the Jetavana monastery, and thought how the World-honoured one had formerly resided there for twenty-five years, painful reflections arose in their minds."

[[stages]]
place = "lumbini"
year = 405
cite = "A Record of Buddhistic Kingdoms, chapter XXII"
passage = "Fifty le east from the city was a garden, named Lumbini, where the queen entered the pond and bathed."

[[stages]]
place = "kusinagara"
year = 405
cite = "A Record of Buddhistic Kingdoms, chapter XXIV"
passage = "Going on twelve yojanas, still to the east, they came to the city of Kusanagara, on the north of which, between two trees, on the bank of the Nairanjana river, is the place where the World-honoured one, with his head to the north, attained to pari-nirvâna (and died)."

[[stages]]
place = "vaisali"
year = 405
cite = "A Record of Buddhistic Kingdoms, chapter XXV"
passage = "East from this city ten yojanas, (the travellers) came to the kingdom of Vaisali."

[[stages]]
place = "pataliputra"
year = 405
cite = "A Record of Buddhistic Kingdoms, chapter XXVII"
passage = "Having crossed the river, and descended south for a yojana, (the travellers) came to the town of Pataliputtra, in the kingdom of Magadha, the city where king Asoka ruled."

[[stages]]
place = "rajagriha"
year = 406
cite = "A Record of Buddhistic Kingdoms, chapter XXVIII"
passage = "Leaving the city by the south gate, and proceeding south four le, one enters a valley, and comes to a circular space formed by five hills, which stand all round it, and have the appearance of the suburban wall of a city."

[[stages]]
place = "gridhrakuta"
year = 406
cite = "A Record of Buddhistic Kingdoms, chapter XXIX"
passage = "Entering the valley, and keeping along the mountains on the south-east, after ascending fifteen le, (the travellers) came to mount Gridhra-kuta. / With this, in front of the rock cavern, he chanted the Surangama Sutra, remained there over the night, and then returned towards the New City."

[[stages]]
place = "gaya"
year = 406
cite = "A Record of Buddhistic Kingdoms, chapter XXXI"
passage = "From this place, after travelling to the west for four yojanas, (the pilgrims) came to the city of Gaya; but inside the city all was emptiness and desolation."

[[stages]]
place = "bodhgaya"
year = 406
cite = "A Record of Buddhistic Kingdoms, chapter XXXI"
passage = "The Bodhisattva went forward to the patra tree, placed the kusa grass at the foot of it, and sat down with his face to the east."

[[stages]]
place = "varanasi"
year = 406
cite = "A Record of Buddhistic Kingdoms, chapter XXXIV"
passage = "Pursuing the same course, and going still to the west, he arrived, after twelve yojanas, at the city of Varanasi in the kingdom of Kasi."

[[stages]]
place = "sarnath"
year = 406
cite = "A Record of Buddhistic Kingdoms, chapter XXXIV"
passage = "Rather more than ten le to the north-east of the city, he found the vihâra in the park of “The rishi’s Deer-wild.” In this park there formerly resided a Pratyeka Buddha, with whom the deer were regularly in the habit of stopping for the night."

[[stages]]
place = "pataliputra"
year = 406
cite = "A Record of Buddhistic Kingdoms, chapter XXXVI"
passage = "From Varanasi (the travellers) went back east to Pataliputtra. / In consequence (of this success in his quest) Fâ-Hien stayed here for three years, learning Sanskrit books and the Sanskrit speech, and writing out the Vinaya rules."

[[stages]]
place = "champa"
year = 409
cite = "A Record of Buddhistic Kingdoms, chapter XXXVII"
passage = "Following the course of the Ganges, and descending eastwards for eighteen yojanas, he found on the southern bank the great kingdom of Champa, with topes reared at the places where Buddha walked in meditation by his vihâra, and where he and the three Buddhas, his predecessors, sat."

[[stages]]
place = "tamalipti"
year = 409
cite = "A Record of Buddhistic Kingdoms, chapter XXXVII"
passage = "Continuing his journey east for nearly fifty yojanas, he came to the country of Tamalipti, (the capital of which is) a seaport. / Here Fâ-Hien stayed two years, writing out his Sûtras, and drawing pictures of images."

[[stages]]
place = "singhala"
year = 411
cite = "A Record of Buddhistic Kingdoms, chapters XXXVII and XXXVIII"
passage = "It was the beginning of winter, and the wind was favourable; and, after fourteen days, sailing day and night, they came to the country of Singhala. / Several years had now elapsed since Fâ-Hien left the land of Han; the men with whom he had been in intercourse had all been of regions strange to him; his eyes had not rested on an old and familiar hill or river, plant or tree"

[[stages]]
place = "laoshan"
year = 413
cite = "A Record of Buddhistic Kingdoms, chapter XL"
passage = "After proceeding in this way for rather more than ninety days, they arrived at a country called Java-dvipa / after sailing day and night for twelve days, they reached the shore on the south of mount Lao, on the borders of the prefecture of Ch’ang-kwang, and immediately got good water and vegetables."

[[stages]]
place = "qingzhou"
year = 413
cite = "A Record of Buddhistic Kingdoms, chapter XL"
passage = "(but) when (Fâ-Hien) arrived at Ts’ing-chow, (the prefect there) begged him (to remain with him) for a winter and a summer."

[[stages]]
place = "nanking"
year = 414
cite = "A Record of Buddhistic Kingdoms, chapter XL"
passage = "After the summer retreat was ended, Fâ-Hien, having been separated for a long time from his (fellow-)masters, wished to hurry to Ch’ang-gan; but as the business which he had in hand was important, he went south to the Capital"
note = "Legge takes the Capital to be “Nan-king, which was the capital of the Eastern Tsin dynasty under another name.”"
