[[stages]]
place = "acre"
part = 1
cite = "Prologue, chapter XI"
passage = "When the Two Brothers had received the Legate’s letters, they set forth from Acre to return to the Grand Kaan, and got as far as Layas."

[[stages]]
place = "layas"
part = 1
cite = "Book I, chapter I"
passage = "Howbeit, they have a city upon the sea, which is called Layas, at which there is a great trade."

[[stages]]
place = "tauris"
part = 1
cite = "Book I, chapter XI"
passage = "Tauris is a great and noble city, situated in a great province called Yrac, in which are many other towns and villages."

[[stages]]
place = "yasdi"
part = 1
cite = "Book I, chapter XVI"
passage = "Yasdi also is properly in Persia; it is a good and noble city, and has a great amount of trade."

[[stages]]
place = "kerman"
part = 1
cite = "Book I, chapter XVII"
passage = "Kerman is a kingdom which is also properly in Persia, and formerly it had a hereditary prince."

[[stages]]
place = "hormos"
part = 1
cite = "Book I, chapter XIX"
passage = "When you have ridden these two days you come to the Ocean Sea, and on the shore you find a city with a harbour which is called Hormos."

[[stages]]
place = "cobinan"
part = 1
cite = "Book I, chapter XXI"
passage = "There is much Iron and Steel and Ondanique, and they make steel mirrors of great size and beauty."

[[stages]]
place = "sapurgan"
part = 1
cite = "Book I, chapter XXVI"
passage = "So after travelling for six days as I have told you, you come to a city called Sapurgan. It has great plenty of everything, but especially of the very best melons in the world."

[[stages]]
place = "balc"
part = 1
cite = "Book I, chapter XXVII"
passage = "Balc is a noble city and a great, though it was much greater in former days. But the Tartars and other nations have greatly ravaged and destroyed it."

[[stages]]
place = "badashan"
part = 1
cite = "Book I, chapter XXIX"
passage = "Badashan is a Province inhabited by people who worship Mahommet, and have a peculiar language. It forms a very great kingdom, and the royalty is hereditary."

[[stages]]
place = "pamier"
part = 1
cite = "Book I, chapter XXXII"
passage = "The plain is called Pamier, and you ride across it for twelve days together, finding nothing but a desert without habitations or any green thing, so that travellers are obliged to carry with them whatever they have need of."

[[stages]]
place = "cascar"
part = 1
cite = "Book I, chapter XXXIII"
passage = "Cascar is a region lying between north-east and east, and constituted a kingdom in former days"

[[stages]]
place = "yarcan"
part = 1
cite = "Book I, chapter XXXV"
passage = "The people follow the Law of Mahommet, but there are also Nestorian and Jacobite Christians."

[[stages]]
place = "cotan"
part = 1
cite = "Book I, chapter XXXVI"
passage = "Cotan is a province lying between north-east and east, and is eight days’ journey in length."

[[stages]]
place = "charchan"
part = 1
cite = "Book I, chapter XXXVIII"
passage = "The Province contains rivers which bring down Jasper and Chalcedony, and these are carried for sale into Cathay, where they fetch great prices."

[[stages]]
place = "sachiu"
part = 1
cite = "Book I, chapter XL"
passage = "you come to a city called Sachiu, lying between north-east and east ; it belongs to the Great Kaan, and is in a province called Tangut."

[[stages]]
place = "campichu"
part = 1
cite = "Book I, chapter XLIV"
passage = "Campichu is also a city of Tangut, and a very great and noble one. Indeed it is the capital and place of government of the whole province of Tangut."

[[stages]]
place = "chandu"
part = 1
cite = "Book I, chapter LXI"
passage = "And when you have ridden three days from the city last mentioned, between north-east and north, you come to a city called Chandu / There is at this place a very fine marble Palace, the rooms of which are all gilt and painted with figures of men and beasts and birds"

[[stages]]
place = "cambaluc"
part = 2
cite = "Book II, chapter XI"
passage = "Now there was on that spot in old times a great and noble city called Cambaluc"

[[stages]]
place = "juju"
part = 2
cite = "Book II, chapter XXXVI"
passage = "you come after 30 miles to a fine large city called Juju, where there are many abbeys of idolaters, and the people live by trade and manufactures."

[[stages]]
place = "taianfu"
part = 2
cite = "Book II, chapter XXXVII"
passage = "After riding then those ten days from the city of Juju, you find yourself in a kingdom called Taianfu, and the city at which you arrive, which is the capital, is also called Taianfu, a very great and fine city."

[[stages]]
place = "kenjanfu"
part = 2
cite = "Book II, chapter XLI"
passage = "A very great and fine city it is, and the capital of the kingdom of Kenjanfu, which in old times was a noble, rich, and powerful realm, and had many great and wealthy and puissant kings."

[[stages]]
place = "sindafu"
part = 2
cite = "Book II, chapter XLIV"
passage = "then you arrive at a plain belonging to a province called Sindafu, which still is on the confines of Manzi"

[[stages]]
place = "yachi"
part = 2
cite = "Book II, chapter XLVIII"
passage = "called Yachi, a very great and noble city, in which are numerous merchants and craftsmen."

[[stages]]
place = "mien"
part = 2
cite = "Book II, chapter LIV"
passage = "then you arrive at the capital city of this Province of Mien, and it also is called Amien, and is a very great and noble city."

[[stages]]
place = "cambaluc"
part = 3
cite = "Book II, chapter XI"
passage = "So he caused the present city to be built close beside the old one, with only a river between them."

[[stages]]
place = "yanju"
part = 3
cite = "Book II, chapter LXVIII"
passage = "at the end of your journey you arrive at the very great and noble city of Yanju, which has seven-and-twenty other wealthy cities under its administration / And Messer Marco Polo himself, of whom this book speaks, did govern this city for three full years, by the order of the Great Kaan."

[[stages]]
place = "kinsay"
part = 3
cite = "Book II, chapter LXXVI"
passage = "When you have left the city of Changan and have travelled for three days through a splendid country, passing a number of towns and villages, you arrive at the most noble city of Kinsay"

[[stages]]
place = "fuju"
part = 3
cite = "Book II, chapter LXXXI"
passage = "Now this city of Fuju is the key of the kingdom which is called Chonka, and which is one of the nine great divisions of Manzi."

[[stages]]
place = "zayton"
part = 3
cite = "Book II, chapter LXXXII"
passage = "When you have accomplished those five days’ journey you arrive at the very great and noble city of Zayton, which is also subject to Fuju. At this city you must know is the Haven of Zayton, frequented by all the ships of India, which bring thither spicery and all other kinds of costly wares."

[[stages]]
place = "zayton"
part = 4
cite = "Book III, chapter V"
passage = "You must know that on leaving the port of Zayton you sail west-south-west for 1500 miles, and then you come to a country called Chamba"

[[stages]]
place = "chamba"
part = 4
cite = "Book III, chapter V"
passage = "a very rich region, having a king of its own."

[[stages]]
place = "samara"
part = 4
cite = "Book III, chapter X"
passage = "So you must know that when you leave the kingdom of Basma you come to another kingdom called Samara, on the same Island. / And in that kingdom Messer Marco Polo was detained five months by the weather, which would not allow of his going on."

[[stages]]
place = "seilan"
part = 4
cite = "Book III, chapter XIV"
passage = "When you leave the Island of Angamanain and sail about a thousand miles in a direction a little south of west, you come to the Island of Seilan"

[[stages]]
place = "maabar"
part = 4
cite = "Book III, chapter XVI"
passage = "you come to the great province of Maabar which is styled India the Greater ; it is best of all the Indies and is on the mainland."

[[stages]]
place = "hormos"
part = 4
cite = "Book III, chapter XL"
passage = "When you leave the City of Calatu, and go for 300 miles between north-west and north, you come to the city of Hormos; a great and noble city on the sea."

[[stages]]
place = "trebizond"
part = 4
cite = "Prologue, chapter XVIII"
passage = "Having left Kiacatu they travelled day by day till they came to Trebizond"

[[stages]]
place = "constantinople"
part = 4
cite = "Prologue, chapter XVIII"
passage = "and thence to Constantinople"

[[stages]]
place = "negropont"
part = 4
cite = "Prologue, chapter XVIII"
passage = "from Constantinople to Negropont"

[[stages]]
place = "venice"
part = 4
year = 1295
cite = "Prologue, chapter XVIII"
passage = "and from Negropont to Venice. And this was in the year 1295 of Christ’s Incarnation."
