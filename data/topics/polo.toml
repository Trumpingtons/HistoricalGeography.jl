# The journeys of Marco Polo, 1271 to 1295, as his Book tells them in the translation of Henry Yule (third edition,
# revised by Henri Cordier, 1903): the way out to the Great Kaan, two of the journeys in his service, and the voyage
# home, each a part of its own. Each stage is a place the Book describes on the way, with its words; the Book
# describes many more, some Marco only heard of. Each place is the one Yule's notes identify, by its Wikidata item,
# from which its coordinates come.

