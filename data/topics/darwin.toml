# The voyage of HMS Beagle round the world, from Devonport on 27 December 1831 to Falmouth on 2 October 1836, as
# Charles Darwin tells it in his Journal of Researches (the second edition, of 1845, in its printing of 1860 on
# Wikisource), each stage with its date and passage, in the order of the voyage: the Journal tells some of its
# chapters out of that order, and Darwin's journeys by land, such as across the Andes to Mendoza, are stages too.
# Each place has its Wikidata item, from which its coordinates come.

