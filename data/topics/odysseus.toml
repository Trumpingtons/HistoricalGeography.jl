# The wanderings of Odysseus from Troy to Ithaca, as the Odyssey tells them (books 5 to 13, in A. T. Murray's
# translation), each stage with its lines. The places after Cape Malea are of legend: each is put where an ancient
# author identified it, with that author's words, in the translations of Perseus (Strabo by H. C. Hamilton and
# W. Falconer, and by H. L. Jones; Thucydides by R. Crawley). Each place has its Wikidata item, from which its
# coordinates come.

title = "The Wanderings of Odysseus"
work = "Homer, Odyssey, translated by A. T. Murray"
text = "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0012/tlg002/tlg0012.tlg002.perseus-eng3.xml"
