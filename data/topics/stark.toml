# The travels of Freya Stark in the Levant, Persia and southern Arabia, from 1927 to 1935, as she tells them in three
# of her books: Letters from Syria (1942), her letters home from her first journey east in 1927 and 1928, to the Druze
# country of the Jebel Druse under the French Mandate; The Valleys of the Assassins and Other Persian Travels (1934),
# her journeys of 1930 and 1931 to the valleys of the Assassins and the Throne of Solomon in the Elburz, of 1931 in
# Luristan and of 1932 in Pusht-i-Kuh; and The Southern Gates of Arabia (1936), her journey of 1935 in the Hadhramaut.
# Each journey is a part of its own, in the order she made them, and each stage is a place she names on the way, with
# a short quotation of her words; the stages of the letters have the date of the letter that tells them, the others
# their year, or their date where she gives it. The books are in copyright: the quotations are short, and the
# copyright of the words is the estate's. Each place has its Wikidata item, from which its coordinates come.
#
# The texts: Letters from Syria (John Murray, 1942), https://archive.org/details/in.ernet.dli.2015.60665; The Valleys
# of the Assassins (John Murray, 1934), https://archive.org/details/in.ernet.dli.2015.211087; The Southern Gates of
# Arabia (E. P. Dutton, 1936), https://archive.org/details/southerngatesofa012570mbp.

title = "The Travels of Freya Stark"
work = "Freya Stark, Letters from Syria (1942), The Valleys of the Assassins and Other Persian Travels (1934) and The Southern Gates of Arabia: A Journey in the Hadhramaut (1936)"
text = "https://archive.org/details/in.ernet.dli.2015.211087"
licence = "Short quotations; copyright the estate of Freya Stark"

