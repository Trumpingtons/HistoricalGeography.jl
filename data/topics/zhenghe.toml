# The seven voyages of Zheng He, 1405 to 1431, as the inscription he and his officers set up at Changle in 1431 records
# them, voyage by voyage, with the inscription they set up at Liujiagang the same year. Each stage is a country a
# voyage reached, with the inscription's words; the inscriptions name the countries, not the order the fleet reached
# them in, so the stages are not joined by a route. The years are those of the reigns, Yongle (its third year is 1405)
# and Xuande (its sixth year is 1431). Each place has its Wikidata item, from which its coordinates come.

