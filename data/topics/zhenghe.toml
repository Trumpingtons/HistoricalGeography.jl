[[stages]]
place = "calicut"
part = 1
year = 1405
cite = "Changle inscription, first voyage"
passage = "一、永樂三年，統領舟師，至古里等國。"
summary = "In the third year of Yongle, the fleet sails to Calicut and other countries."

[[stages]]
place = "palembang"
part = 1
year = 1405
cite = "Changle inscription, first voyage"
passage = "時海寇陳祖義聚衆三佛齊國，劫掠番商，亦來犯我舟師，卽有神兵陰助，一鼓而殄滅之，至五年廻。"
summary = "The pirate Chen Zuyi, gathering men in Palembang to plunder foreign merchants, attacks the fleet and is destroyed; the fleet is back in the fifth year."

[[stages]]
place = "java"
part = 2
year = 1407
cite = "Changle inscription, second voyage"
passage = "一、永樂五年，統領舟師，往爪哇、古里、柯枝、暹羅等國，王各以珎寶珎禽異獸貢獻，至七年廻還。"
summary = "In the fifth year of Yongle, the fleet sails to Java, Calicut, Cochin, Siam and other countries, whose kings offer treasures, rare birds and strange animals; it is back in the seventh year."

[[stages]]
place = "calicut"
part = 2
year = 1407
cite = "Changle inscription, second voyage"
passage = "一、永樂五年，統領舟師，往爪哇、古里、柯枝、暹羅等國，王各以珎寶珎禽異獸貢獻，至七年廻還。"
summary = "In the fifth year of Yongle, the fleet sails to Java, Calicut, Cochin, Siam and other countries, whose kings offer treasures, rare birds and strange animals; it is back in the seventh year."

[[stages]]
place = "cochin"
