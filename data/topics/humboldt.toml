# The journey of Alexander von Humboldt and Aimé Bonpland in the Americas, from Corunna on 5 June 1799 to
# Philadelphia in 1804, as Humboldt tells it in four of his works: the Personal Narrative of Travels to the
# Equinoctial Regions of America (translated by Thomasina Ross, 1852), which ends at Cartagena in 1801, then Views of
# Nature (translated by Elizabeth Otté and Henry George Bohn, 1850), Researches concerning the Institutions and
# Monuments of the Ancient Inhabitants of America (translated by Helen Maria Williams, 1814) and the Political Essay on
# the Kingdom of New Spain (translated by John Black, 1811). Each stage is a place Humboldt dates or describes on the
# way, with his words, in the order of the journey; the stages without a date in his words have their year only.
# Each place has its Wikidata item, from which its coordinates come.
#
# The texts: Personal Narrative, https://www.gutenberg.org/ebooks/6322, 7014 and 7254; Views of Nature,
# https://archive.org/details/ofnatureviewsorc00humbrich; Researches, https://archive.org/details/researchesconcer01humb
# and researchesconcer02humb; Political Essay, https://archive.org/details/b29350451_0001.

