[[stages]]
place = "corunna"
date = 1799-06-05
cite = "Personal Narrative, Chapter I"
passage = "On the 4th of June, in the evening, the wind turned to north-east, a point which, on the coast of Galicia, is considered very constant during the summer. The Pizarro prepared to sail on the 5th / The Pizarro set sail at two in the afternoon."

[[stages]]
place = "teide"
date = 1799-06-21
cite = "Personal Narrative, Chapter II"
passage = "On the morning of the 21st of June, we were on our way to the summit of the volcano. / We prolonged in vain our stay on the summit of the Peak"

[[stages]]
place = "cumana"
date = 1799-07-16
cite = "Personal Narrative, Chapter IV"
passage = "On the 16th of July, 1799, at break of day, we beheld a verdant coast, of picturesque aspect."

[[stages]]
place = "guacharo"
date = 1799-09-18
cite = "Personal Narrative, Chapter VII"
passage = "That which confers most celebrity on the valley of Caripe, besides the extraordinary coolness of its climate, is the great Cueva, or Cavern of the Guacharo. / We set out for the Sierra on the 18th of September"

[[stages]]
place = "caracas"
date = 1799-11-21
cite = "Personal Narrative, Chapter XI"
passage = "I reached Caracas on the 21st of November"

[[stages]]
place = "valencia"
date = 1800-02-21
cite = "Personal Narrative, Chapter XVI"
passage = "On the 21st of February, in the evening, we set out from the beautiful Hacienda de Cura for Guacara and Nueva Valencia. / By felling the trees which cover the tops and the sides of mountains, men in every climate prepare at once two calamities for future generations; want of fuel and scarcity of water."

[[stages]]
place = "calabozo"
date = 1800-03-24
cite = "Personal Narrative, Chapter XVII"
passage = "nothing at Calabozo excited in us so great an interest as the gymnoti, which are animated electrical apparatuses. / We left the town of Calabozo on the 24th of March, highly satisfied with our stay, and the experiments we had made on an object so worthy of the attention of physiologists."

[[stages]]
place = "sanfernando"
date = 1800-03-27
cite = "Personal Narrative, Chapter XVII"
passage = "We arrived on the 27th of March at the Villa de San Fernando, the capital of the Mission of the Capuchins in the province of Varinas."

[[stages]]
place = "atures"
date = 1800-04-16
cite = "Personal Narrative, Chapter XX"
passage = "On the 16th of April, towards evening, we received tidings that in less than six hours our boat had passed the rapids, and had arrived in good condition in a cove called el Puerto de arriba, or the Port of the Expedition."
summary = "The rapids of Atures, the first great cataract of the Orinoco."

[[stages]]
place = "maypures"
year = 1800
cite = "Personal Narrative, Chapter XXI"
passage = "They redoubled their efforts, and we arrived at nightfall, without any accident, in the port of Maypures."

[[stages]]
place = "pimichin"
date = 1800-05-05
cite = "Personal Narrative, Chapter XXII"
passage = "On the 5th of May we set off, to follow on foot our canoe, which had at length arrived, by the portage, at the Cano Pimichin."

[[stages]]
place = "sancarlos"
year = 1800
cite = "Personal Narrative, Chapter XXIII"
passage = "We left the island of Dapa long before daybreak; and notwithstanding the rapidity of the current, and the activity of our rowers, our passage to the fort of San Carlos del Rio Negro occupied twelve hours."

[[stages]]
place = "casiquiare"
date = 1800-05-20
cite = "Personal Narrative, Chapter XXIII"
passage = "We passed the night of the 20th of May, the last of our passage on the Cassiquiare, near the point of the bifurcation of the Orinoco."
summary = "The Cassiquiare joins the Orinoco to the Rio Negro, and so to the Amazon."

[[stages]]
place = "esmeralda"
date = 1800-05-23
cite = "Personal Narrative, Chapter XXIV"
passage = "We left the mission of Esmeralda on the 23rd of May."

[[stages]]
place = "angostura"
year = 1800
cite = "Personal Narrative, Chapter XXIV"
passage = "It would be difficult for me to express the satisfaction we felt on landing at Angostura, the capital of Spanish Guiana / we resolved to stay at Angostura till the 10th of July."

[[stages]]
place = "barcelona"
date = 1800-07-23
cite = "Personal Narrative, Chapter XXVI"
passage = "We arrived, on the 23rd of July, at the town of Nueva Barcelona"

[[stages]]
place = "havana"
date = 1800-12-19
cite = "Personal Narrative, Chapter XXVIII"
passage = "We anchored in the port of the Havannah on the 19th December after a passage of twenty-five days in continuous bad weather."

[[stages]]
place = "trinidad"
year = 1801
cite = "Personal Narrative, Chapter XXIX"
passage = "Proceeding from the mouth of the Rio Guaurabo to the Villa de la Trinidad, I saw on the north-west, the Lomas de San Juan"

[[stages]]
place = "cartagena"
date = 1801-03-30
cite = "Personal Narrative, Chapter XXX"
passage = "On the morning of the 30th of March we doubled Punta Gigantes, and made for the Boca Chica, the present entrance of the port of Carthagena."

[[stages]]
place = "turbaco"
year = 1801
cite = "Researches, Volume 2"
passage = "We resided in this charming spot in the month of April, 1801, when, after a toilsome passage from the island of Cuba to Carthagena, we were preparing ourselves for a long journey to Santa Fe de Bogota, and the elevated plain of Quito."

[[stages]]
place = "icononzo"
year = 1801
cite = "Researches, Volume 1"
passage = "In the month of September, 1801, we passed these natural bridges of Icononzo, on our journey from Santa Fe de Bogota to Popayan and Quito."

[[stages]]
place = "cotopaxi"
year = 1802
cite = "Researches, Volume 2"
passage = "In the month of April, 1802, in an excursion to the volcano of Cotopaxi, M. Bonpland and myself visited these slight remains of Peruvian architecture"

[[stages]]
place = "pichincha"
year = 1802
cite = "Personal Narrative, Chapter IV"
passage = "we were witnesses of it in 1802, on the brink of the immense crater of Pichincha, from which, nevertheless, at that time, clouds of sulphureous acid vapours only issued."

[[stages]]
place = "chimborazo"
date = 1802-06-23
cite = "Views of Nature, Physiognomy of Plants"
passage = "When MM. Bonpland, Carlos Montufarr and myself, on the 23rd of June, 1802, ascended the eastern declivity of Mount Chimborazo, to a height of 19,286 feet"

[[stages]]
place = "cajamarca"
year = 1802
cite = "Views of Nature, The Plateau or Highlands of Caxamarca"
passage = "Descendants of the Inca still dwell in Caxamarca, amidst the dreary architectural ruins of departed splendour. / We now, for the first time, commanded a view of the Pacific."
note = "Humboldt saw the Pacific from the Alto de Guangamarca, on the way from Caxamarca down to Truxillo."

[[stages]]
place = "trujillo"
year = 1802
cite = "Personal Narrative, Chapter XXX"
passage = "I found the surface of the Pacific ocean, in the month of October 1802 on the coast of Truxillo"

[[stages]]
place = "callao"
date = 1802-11-09
cite = "Views of Nature, The Plateau or Highlands of Caxamarca"
passage = "The transit of Mercury over the Sun's disc, on the 9th of November, 1802 (which I observed at Callao, the port of Lima, from the Round Tower of the Fort of San Felipe)"

[[stages]]
place = "guayaquil"
year = 1803
cite = "Personal Narrative, Chapter V"
passage = "During our abode at Guayaquil, in the month of January 1803"

[[stages]]
place = "acapulco"
year = 1803
cite = "Researches, Volume 1"
passage = "When, arriving in New Spain by way of the South Sea, I went in the month of April, 1803, from Acapulco to Cuernavacca"

[[stages]]
place = "mexico"
year = 1803
cite = "Political Essay on the Kingdom of New Spain, Geographical Introduction"
passage = "my arrival at Mexico in the month of April, 1803."

[[stages]]
place = "havana"
year = 1804
cite = "Personal Narrative, Chapter XXIX"
passage = "On my second visit to the Havannah, in 1804, I could not return to the Sienega of Batabano"

[[stages]]
place = "philadelphia"
year = 1804
cite = "Political Essay on the Kingdom of New Spain, Volume 1, the opening of the Essay"
passage = "A short, but interesting stay, which I made in 1804 at Philadelphia and Washington, enabled me also to draw comparisons between the actual state of the United States and that of Peru and Mexico."
