[[stages]]
place = "moscow"
date = 1697-03-20
cite = "Volume 1, chapter XXIX, The Journey of Peter to Western Europe"
passage = "When these trials were completed, the embassy set out, on March 20, 1697. It was intended to go first to Vienna, then to Venice and Rome, then to Holland and England, and to return by the way of Konigsberg."

[[stages]]
place = "riga"
year = 1697
cite = "Volume 1, chapter XXIX, The Journey of Peter to Western Europe"
passage = "Unfortunately, the embassy was detained at Riga for a whole week by the breaking up of the ice on the Düna, which made crossing impossible. Peter preserved his incognito, and went out to see the town. His military curiosity naturally led him to inspect the fortifications and measure the width and depth of the ditches, when he was somewhat rudely ordered away by the sentinel."

[[stages]]
place = "mitau"
year = 1697
cite = "Volume 1, chapter XXIX, The Journey of Peter to Western Europe"
passage = "Here the Tsar consented to give up in part his incognito, made visits to the Duke, and received them in return. A week was quickly passed in amusement and pleasure, but even with this Peter found time to exercise himself in a carpenter's shop."

[[stages]]
place = "libau"
year = 1697
cite = "Volume 1, chapter XXIX, The Journey of Peter to Western Europe"
passage = "From Mitau Peter proceeded to Libau, where he was detained by bad weather for a week, until he finally took passage on a small ship going to Pillau, the port of Konigsberg. During his stay at Libau, he passed for the skipper of a Russian privateer"

[[stages]]
place = "konigsberg"
year = 1697
cite = "Volume 1, chapter XXIX, The Journey of Peter to Western Europe"
passage = "After taking small lodgings in a street on the Kneiphof, he went out in a close carriage, late at night, and paid a visit to the Elector, entering the palace by a private staircase. The interview lasted for an hour and a half, and the sovereigns were mutually pleased."

[[stages]]
place = "pillau"
date = 1697-06-20
cite = "Volume 1, chapter XXIX, The Journey of Peter to Western Europe"
passage = "On June 20, after nearly a month's stay, Peter went to Pillau, with the intention of taking ship directly to Holland, for he found it more convenient to defer his visit to Vienna till his return."

[[stages]]
place = "colberg"
year = 1697
cite = "Volume 1, chapter XXIX, The Journey of Peter to Western Europe"
passage = "Instead of going by sea from Pillau to Holland, Peter went no farther than Colberg, as he was fearful of falling in with the French squadron, which was said to be escorting the Prince de Conti to Poland."

[[stages]]
place = "brocken"
year = 1697
cite = "Volume 1, chapter XXIX, The Journey of Peter to Western Europe"
passage = "From that place he travelled by land as speedily as possible, stopping only to look at the famous iron-works near Ilsenburg, and to ascend the Brocken for the view."

[[stages]]
place = "koppenbrugge"
year = 1697
cite = "Volume 1, chapter XXIX, The Journey of Peter to Western Europe, quoting the Electress Sophia of Hanover"
passage = "He told us that he worked himself in building ships, showed us his hands, and made us touch the callous places that had been caused by work."

[[stages]]
place = "zaandam"
date = 1697-08-18
cite = "Volume 1, chapter XXX, Peter in Holland"
passage = "the Tsar reached Zaandam early on the morning of August 18, having with him only six volunteers, including the Prince of Imeritia and the two brothers Menshikof. / The next day he entered himself as a ship-carpenter at the wharf of Lynst Rogge, on the Buitenzaan."

[[stages]]
place = "amsterdam"
date = 1697-08-30
cite = "Volume 1, chapter XXX, Peter in Holland"
passage = "He returned early the next morning, August 30, and went straight to the wharf of the East India Company, at Oostenburg. For more than four months, with occasional absences, he worked here at ship-building, under the direction of the Baas Gerrit Claes Pool."

[[stages]]
place = "utrecht"
year = 1697
cite = "Volume 1, chapter XXX, Peter in Holland"
passage = "Partly for this purpose he went to Utrecht together with Lefort and Witsen, where he had an interview with the King in the Toelast Hotel. Although the details of this interview have never been known, it was thought worthy of a commemorative medal."

[[stages]]
place = "hague"
year = 1697
cite = "Volume 1, chapter XXX, Peter in Holland"
passage = "The embassy was splendidly received at the Hague, and lodged in the Oude Doelen Hotel, as the palace of Prince Maurice, the usual ambassadorial lodging, was already full. / the presence of the Tsar (for he had gone on to the Hague for a few days, to witness the ceremonies) gave additional effect."

[[stages]]
place = "leyden"
year = 1697
cite = "Volume 1, chapter XXX, Peter in Holland"
passage = "In Leyden he made the acquaintance of the great Boerhave, and visited the celebrated botanical garden under his guidance"

[[stages]]
place = "delft"
year = 1697
cite = "Volume 1, chapter XXX, Peter in Holland"
passage = "he studied the microscope under the naturalist Leeuwenhoek."

[[stages]]
place = "amsterdam"
date = 1698-01-17
cite = "Volume 1, chapter XXX, Peter in Holland"
passage = "Together with a favourable answer, came English vessels for himself and the great embassy, and on January 17, 1698, Peter, leaving his embassy in Holland, set out for England."

[[stages]]
place = "london"
year = 1698
cite = "Volume 1, chapter XXXI, Visit of the Tsar to England"
passage = "Leaving its convoy at the mouth of the Thames, the yacht anchored at St. Katherine's, and Peter was rowed in a barge past the Tower and London Bridge, and landed at a house in Norfolk Street, Strand"

[[stages]]
place = "deptford"
year = 1698
cite = "Volume 1, chapter XXXI, Visit of the Tsar to England"
passage = "For greater convenience, and to get rid of the crowds who watched for his appearance, he removed to Deptford, where he occupied Sayes Court, the house of John Evelyn."

[[stages]]
place = "portsmouth"
year = 1698
cite = "Volume 1, chapter XXXI, Visit of the Tsar to England"
passage = "a week spent in going to Portsmouth, where he was gratified by a review of the English fleet off Spithead"

[[stages]]
place = "oxford"
year = 1698
cite = "Volume 1, chapter XXXI, Visit of the Tsar to England"
passage = "a couple of days at Oxford, where he received the degree of Doctor of Laws"

[[stages]]
place = "kensington"
date = 1698-04-28
cite = "Volume 1, chapter XXXI, Visit of the Tsar to England"
passage = "Peter and Golovin took their leave of the King at Kensington Palace, on April 28."

[[stages]]
place = "chatham"
year = 1698
cite = "Volume 1, chapter XXXI, Visit of the Tsar to England"
passage = "On May 2, he left Deptford in the yacht, the 'Transport Royal,' given to him by King William, but even then could not resist running up to Chatham to see the docks there"

[[stages]]
place = "amsterdam"
date = 1698-05-19
cite = "Volume 1, chapter XXXI, Visit of the Tsar to England"
passage = "On arriving at Amsterdam, Peter found several relatives of Lefort who had come from Geneva for the purpose of seeing him."

[[stages]]
place = "cleves"
year = 1698
cite = "Volume 1, chapter XXXII, The Journey Home"
passage = "walked through the beautiful park at Cleves, where he carved his name on a birch-tree."

[[stages]]
place = "bielefeld"
year = 1698
cite = "Volume 1, chapter XXXII, The Journey Home"
passage = "He also visited the linen factories at Bielefeld"

[[stages]]
place = "dresden"
year = 1698
cite = "Volume 1, chapter XXXII, The Journey Home"
passage = "In Dresden he was delighted with the curiosities of the Green Vaults, where he went immediately after his arrival, and stayed all night."

[[stages]]
place = "konigstein"
year = 1698
cite = "Volume 1, chapter XXXII, The Journey Home"
passage = "surveyed the fortifications of Konigstein"

[[stages]]
place = "vienna"
date = 1698-06-26
cite = "Volume 1, chapter XXXII, The Journey Home"
passage = "In spite of his haste, it took Peter a month to reach Vienna, where he arrived on June 26 / Peter appeared as a Frisian peasant / his post-horses took the road for Moscow, and not for Venice."

[[stages]]
place = "cracow"
year = 1698
cite = "Volume 1, chapter XXXII, The Journey Home"
passage = "Peter travelled day and night, and refused even to stop in Cracow, where a banquet had been prepared for him."

[[stages]]
place = "wieliczka"
year = 1698
cite = "Volume 1, chapter XXXII, The Journey Home"
passage = "He was therefore able to travel more leisurely, looked carefully at the great salt mines of Wieliczka, and at Bochnia inspected the Polish army, which was encamped there."

[[stages]]
place = "rawa"
date = 1698-08-09
cite = "Volume 1, chapter XXXII, The Journey Home"
passage = "At Rawa, a small village of Galicia, he met King Augustus on August 9, and was his guest for four days."

[[stages]]
place = "zamosc"
year = 1698
cite = "Volume 1, chapter XXXII, The Journey Home"
passage = "After leaving the King, Peter went on to Moscow through Zamosc, where he was entertained by the widow of the castellan."

[[stages]]
place = "brzesc"
year = 1698
cite = "Volume 1, chapter XXXII, The Journey Home"
passage = "At Brzesc-Litewski there was an unfortunate adventure with the Metropolitan of the Uniates"

[[stages]]
place = "moscow"
date = 1698-09-04
cite = "Volume 1, chapter XXXII, The Journey Home"
passage = "Notwithstanding these delays, Peter arrived at Moscow much sooner than he was expected — on September 4, at six o'clock in the evening."
