# The Grand Embassy of Peter the Great, 1697 and 1698, as Eugene Schuyler tells it in Peter the Great, Emperor of Russia
# (1884), volume 1, chapters XXIX to XXXII: from Moscow by Riga, Mitau and Libau to Konigsberg, across Germany to
# Zaandam and Amsterdam, where the Tsar worked as a ship-carpenter, to London and Deptford, and home by Dresden and
# Vienna, from which the revolt of the Streltsi called him back to Moscow. Peter wrote no account of the journey, so
# each stage has Schuyler's words, taken from the scan of the University of Toronto's copy at the Internet Archive and
# read against a second scan, Cornell University's; the errors of the scans' text are corrected (Riga for Piga,
# Rogge for Kogge, Düna for Diina). The dates are those Schuyler gives, in the New Style; a stage he does not date has
# its year. The excursions from Amsterdam to Utrecht, the Hague, Delft and Leyden are in the order Schuyler tells them.
# Each place has its Wikidata item, from which its coordinates come.

title = "The Grand Embassy: Peter the Great Tours Western Europe"
