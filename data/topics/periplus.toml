# Places of The Periplus of the Erythraean Sea, the guide of a Greek merchant of the first century to the ports and
# markets of the Red Sea, Arabia, the Persian Gulf and India, in the order of its sections, each with its passage of
# Wilfred H. Schoff's translation (1912), taken from the scan of Cornell University's copy at the Internet Archive
# and read against a second scan, the University of Toronto's; the errors of the scans' text are corrected, and the
# ligature æ is written ae. A place is on the map when Schoff's notes identify it with a site that has a Wikidata
# item: Avalites with Zeila, Malao with Berbera, Opone with Ras Hafun, Muza with Mocha, Cana with Hisn Ghorab by
# Bir Ali, Moscha with Khor Reiri (Khor Rori), Apologus with Obollah (Al-Ubulla), Barygaza with Broach (Bharuch),
# Poduca with Pondicherry, and so on; the places he leaves in doubt, such as Rhapta, Menuthias, Ommana, Barbaricum,
# Minnagara, Nelcynda and the Ganges market-town, are left out, as are Syagrus (Ras Fartak) and Tagara (Ter), for
# which no item was found. Each place has the coordinates of its Wikidata item, which for Mussel Harbor (Myos
# Hormos) is at Quseir al-Qadim, south of Ras Abu Somer, where Schoff put it.

