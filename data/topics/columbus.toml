# The four voyages of Christopher Columbus, 1492 to 1504, as R. H. Major's Select Letters of Christopher Columbus
# (second edition, 1870) gives them: the first, from Palos to Guanahani, Juana and Española, where he left the men of
# La Navidad, and back by Santa Maria of the Azores and Lisbon; the second, from Cadiz by Ferro to Dominica,
# Marigalante, Guadaloupe and Burenquen, to the ruins of La Navidad and the founding of Isabella; the third, from San
# Lucar by the Cape Verde Islands to Trinidad, Paria and San Domingo; and the fourth, from Cadiz to Española, the cape
# of Gracias a Dios, Cariay and Veragua, to Jamaica, where he was stranded, and home by San Domingo to San Lucar. The
# four parts are the four voyages. Each stage has the words of the book: the letters of Columbus and of Dr. Chanca,
# the physician of the second voyage, where they tell of the place, and otherwise Major's introduction, taken from the
# scan of the University of California's copy at the Internet Archive and read against a second scan; the errors of
# the scans' text are corrected, and the marks of Major's notes left out; Guanaham is as the book prints it, after the
# Spanish text it translates. The dates are those of the letters, or of Major's introduction and notes; a stage
# neither dates has its year. Guadaloupe, which Chanca does not name, is the island Major's note puts there;
# Columbus's river at Veragua is the Belén, as Major's introduction says, and his Jamaica is placed at Saint Ann's
# Bay, where he was stranded. Each place has its Wikidata item, from which its coordinates come.

title = "The Voyages of Columbus"
