# it country by country, in the order of its twelve books, from Gaochang to Khotan. The stages are the countries he
# describes along his way, each with words of its section; the Records name far more, some he only heard of.
# Each country is placed at its capital or main site, by its Wikidata item, from which its coordinates come.

