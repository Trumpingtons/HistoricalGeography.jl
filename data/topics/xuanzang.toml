[[stages]]
place = "gaochang"
cite = "Book 1, preface"
passage = "出高昌故地，自近者始，曰阿耆尼國。"
summary = "Leaving the old land of Gaochang, and beginning with the nearest, the first country is Agni."

[[stages]]
place = "agni"
cite = "Book 1, Agni"
passage = "阿耆尼國東西六百餘里，南北四百餘里。國大都城周六七里，四面據山，道險易守。"
summary = "Agni is more than 600 li from east to west and 400 from north to south. Its capital, 6 or 7 li round, has hills on every side; the roads are steep and easy to hold."

[[stages]]
place = "kucha"
cite = "Book 1, Kucha"
passage = "屈支國。東西千餘里。南北六百餘里。國大都城周十七八里。宜穈麥有粳稻出蒲萄石榴。"
summary = "Kucha is more than 1,000 li from east to west and 600 from north to south; its capital is 17 or 18 li round. It grows millet, wheat and rice, grapes and pomegranates."

[[stages]]
place = "baluka"
cite = "Book 1, Baluka"
passage = "國西北行三百餘里度石磧至凌山。此則葱嶺北原。水多東流矣。山谷積雪春夏合凍。"
summary = "Going north-west for more than 300 li, across a stony desert, one comes to the Ice Mountain, the northern height of the Pamirs, whose waters mostly flow east; its valleys hold snow frozen through spring and summer."

[[stages]]
place = "chach"
cite = "Book 1, Chach"
passage = "赭時國。周千餘里。西臨葉河。東西狹南北長。"
summary = "Chach is more than 1,000 li round, bordered on the west by the Ye river (the Syr Darya), narrow from east to west and long from north to south."

[[stages]]
place = "samarkand"
cite = "Book 1, Samarkand"
passage = "颯秣建國。周千六七百里。東西長南北狹。國大都城周二十餘里。極險固多居人。異方寶貨多聚此國。"
summary = "Samarkand is 1,600 or 1,700 li round; its capital, more than 20 li round, is strongly defended and populous, and the precious goods of foreign lands gather there."

[[stages]]
place = "termez"
cite = "Book 1, Termez"
passage = "呾蜜國。東西六百餘里。南北四百餘里。國大都城周二十餘里。東西長南北狹。伽藍十餘所。僧徒千餘人。"
summary = "Termez is more than 600 li from east to west and 400 from north to south; its capital is more than 20 li round, with some ten monasteries and more than 1,000 monks."

[[stages]]
place = "balkh"
cite = "Book 1, Balkh"
passage = "縛喝國。東西八百餘里。南北四百餘里。北臨縛芻河。國大都城周二十餘里。人皆謂之小王舍城也。"
summary = "Balkh is more than 800 li from east to west and 400 from north to south, bordered on the north by the Oxus; its capital, more than 20 li round, is called the Little Rajagriha."

[[stages]]
place = "bamiyan"
cite = "Book 1, Bamiyan"
passage = "王城東北山阿有立佛石像。高百四五十尺。金色晃曜寶飾煥爛。"
summary = "On a hillside north-east of the royal city stands a stone image of the Buddha, 140 or 150 feet high, shining with gold and brilliant ornaments."

[[stages]]
place = "kapisa"
cite = "Book 1, Kapisa"
passage = "迦畢試國。周四千餘里。北背雪山。三陲黑嶺。國大都城周十餘里。"
summary = "Kapisa is more than 4,000 li round, with the Snowy Mountains to the north and Black Ranges on its other three sides; its capital is more than 10 li round."

[[stages]]
place = "nagarahara"
cite = "Book 2, Nagarahara"
passage = "那揭羅曷國東西六百餘里，南北二百五六十里。山周四境，懸隔危險。"
summary = "Nagarahara is more than 600 li from east to west and 250 or 260 from north to south, surrounded by steep and dangerous mountains."

[[stages]]
place = "gandhara"
cite = "Book 2, Gandhara"
passage = "健馱邏國東西千餘里，南北八百餘里，東臨信度河。國大都城號布路沙布邏，周四十餘里。"
summary = "Gandhara is more than 1,000 li from east to west and 800 from north to south, bordered on the east by the Indus; its capital, Purushapura, is more than 40 li round."

[[stages]]
place = "udyana"
cite = "Book 3, Udyana"
passage = "烏仗那國周五千餘里，山谷相屬，川澤連原。"
summary = "Udyana is more than 5,000 li round, of mountains and valleys, with rivers and marshes between the plains."

[[stages]]
place = "taxila"
cite = "Book 3, Taxila"
passage = "呾叉始羅國周二千餘里，國大都城周十餘里。酋豪力競，王族絕嗣，往者役屬迦畢試國，近又附庸迦濕彌羅國。"
summary = "Taxila is more than 2,000 li round, its capital more than 10 li; its chiefs vie for power, the royal line has died out, and it was subject to Kapisa before and to Kashmir now."

[[stages]]
place = "kashmir"
cite = "Book 3, Kashmir"
passage = "迦濕彌羅國周七千餘里，四境負山。山極峭峻，雖有門徑，而復隘狹，自古鄰敵無能攻伐。"
summary = "Kashmir is more than 7,000 li round, enclosed by mountains so steep, with passes so narrow, that no neighbouring enemy has ever been able to attack it."

[[stages]]
place = "mathura"
cite = "Book 4, Mathura"
passage = "秣菟羅國周五千餘里。國大都城周二十餘里。土地膏腴，稼穡是務。庵沒羅果家植成林，雖同一名而有兩種，小者生青熟黃，大者始終青色。"
summary = "Mathura is more than 5,000 li round, its capital more than 20 li; the soil is rich and farmed, and mangoes grow in groves by every house, of two kinds under one name: the small ones green, turning yellow when ripe, the large ones green throughout."

[[stages]]
place = "sthanesvara"
cite = "Book 4, Sthanesvara"
passage = "薩他泥濕伐羅國周七千餘里。國大都城周二十餘里。土地沃壤，稼穡滋盛。"
summary = "Sthanesvara is more than 7,000 li round, its capital more than 20 li; the soil is fertile and the crops abundant."

[[stages]]
place = "kanyakubja"
cite = "Book 5, Kanyakubja"
passage = "羯若鞠阇國周四千餘里。國大都城西臨殑伽河，其長二十餘里，廣四五里。"
summary = "Kanyakubja is more than 4,000 li round; its capital, on the Ganges to the west, is more than 20 li long and 4 or 5 li wide."

[[stages]]
place = "ayodhya"
cite = "Book 5, Ayodhya"
passage = "阿逾陁國周五千餘里。國大都城周二十餘里。穀稼豐盛，花果繁茂。"
summary = "Ayodhya is more than 5,000 li round, its capital more than 20 li; its crops are plentiful and its flowers and fruit abundant."

[[stages]]
place = "prayaga"
cite = "Book 5, Prayaga"
passage = "缽邏耶伽國周五千餘里。國大都城據兩河交，周二十餘里，稼穡滋盛，果木扶疏。"
summary = "Prayaga is more than 5,000 li round; its capital, more than 20 li round, stands where two rivers meet, among rich crops and fruit trees."

[[stages]]
place = "kausambi"
cite = "Book 5, Kausambi"
passage = "城內故宮中有大精舍，高六十餘尺，有刻檀佛像，上懸石蓋，鄔陀衍那王之所作也。"
summary = "In the old palace of the city is a great temple, more than 60 feet high, with an image of the Buddha carved in sandalwood under a stone canopy, made by King Udayana."

[[stages]]
place = "sravasti"
cite = "Book 6, Sravasti"
passage = "室羅伐悉底國周六千餘里。都城荒頹，疆埸無紀。"
summary = "Sravasti is more than 6,000 li round; its capital is in ruins and its borders are not known."

[[stages]]
place = "kapilavastu"
cite = "Book 6, Kapilavastu"
passage = "劫比羅伐窣堵國周四千餘里。空城十數，荒蕪已甚。"
summary = "Kapilavastu is more than 4,000 li round, with some ten deserted towns, wholly in ruins."
note = "Where Kapilavastu stood is debated: Tilaurakot in Nepal and Piprahwa in India are both proposed."

[[stages]]
place = "kusinagara"
cite = "Book 6, Kusinagara"
passage = "拘屍那揭羅國城郭頹毀，邑里蕭條。故城磚基，周十餘里。"
summary = "The walls of Kusinagara are fallen and its towns desolate; the brick foundations of the old city are more than 10 li round."

[[stages]]
place = "varanasi"
cite = "Book 7, Varanasi"
passage = "婆羅痆斯國周四千餘里。國大都城臨殑伽河，長十八九里，廣五六里。"
summary = "Varanasi is more than 4,000 li round; its capital, on the Ganges, is 18 or 19 li long and 5 or 6 li wide."

[[stages]]
place = "vaisali"
cite = "Book 7, Vaisali"
passage = "吠舍厘國周五千餘里。土地沃壤，花果茂盛，庵沒羅果、茂遮果既多且貴。"
summary = "Vaisali is more than 5,000 li round, its soil fertile, its flowers and fruit abundant, mangoes and plantains plentiful and prized."

[[stages]]
place = "bodhgaya"
cite = "Book 8, Magadha: the enclosure of the Bodhi tree"
passage = "前正覺山西南行十四五里，至菩提樹。周垣磚壘，崇峻險固，東西長，南北狹，周五百餘步。"
summary = "Fourteen or fifteen li south-west of the Pragbodhi mountain is the Bodhi tree, in a high brick enclosure, long from east to west and narrow from north to south, more than 500 paces round."

[[stages]]
place = "nalanda"
cite = "Book 9, Magadha: the monastery of Nalanda"
passage = "從此北行三十餘里，至那爛陁僧伽藍。"
summary = "Going north from here for more than 30 li, one comes to the monastery of Nalanda."

[[stages]]
place = "kamarupa"
cite = "Book 10, Kamarupa"
passage = "迦摩縷波國周萬餘里，國大都城周三十餘里。土地泉濕，稼穡時播。"
summary = "Kamarupa is more than 10,000 li round, its capital more than 30 li; the land is low and moist, and the crops are sown in their seasons."

[[stages]]
place = "tamralipti"
cite = "Book 10, Tamralipti"
passage = "耽摩栗底國周千四五百里，國大都城周十餘里。濱近海垂，土地卑濕。"
summary = "Tamralipti is 1,400 or 1,500 li round, its capital more than 10 li; it lies by the sea, on low and damp land."

[[stages]]
place = "dravida"
cite = "Book 10, Dravida"
passage = "達羅毗荼國周六千餘里，國大都城號建志補羅，周三十餘里。"
summary = "Dravida is more than 6,000 li round; its capital, Kanchipura, is more than 30 li round."

[[stages]]
place = "valabhi"
cite = "Book 11, Valabhi"
passage = "伐臘毗國周六千餘里，國大都城周三十餘里。土地所產，氣序所宜，風俗人性，同摩臘婆國。"
summary = "Valabhi is more than 6,000 li round, its capital more than 30 li; its produce, climate and customs are those of Malava."

[[stages]]
place = "jaguda"
cite = "Book 12, Jaguda"
passage = "漕矩咤國周七千餘里。國大都城號鶴悉那，周三十餘里，或都鶴薩羅城，城周三十餘里，並堅峻險固也。"
summary = "Jaguda is more than 7,000 li round; its capital, Ghazni, is more than 30 li round, or else Hasala, as large, both strongly defended."

[[stages]]
place = "huo"
cite = "Book 12, Huo"
passage = "活國，睹貨邏國故地也，周二千餘里。國大都城周二十餘里。無別君長，役屬突厥。"
summary = "Huo, in the old land of Tukhara, is more than 2,000 li round, its capital more than 20 li; it has no king of its own and is subject to the Turks."

[[stages]]
place = "tashkurgan"
cite = "Book 12, Kabhanda"
passage = "朅盤陁國周二千餘里，國大都城基大石嶺，背徒多河，周二十餘里。山嶺連屬，川原隘狹。"
summary = "Kabhanda is more than 2,000 li round; its capital, more than 20 li round, is built on a great rocky ridge with the Sita river behind it, among mountains and narrow valleys."

[[stages]]
place = "kashgar"
cite = "Book 12, Kashgar"
passage = "佉沙國周五千餘里，多沙磧，少壤土。稼穡殷盛，花果繁茂。"
summary = "Kashgar is more than 5,000 li round, mostly sand and stones with little soil, yet its crops are rich and its flowers and fruit abundant."

[[stages]]
place = "karghalik"
cite = "Book 12, Cakuka"
passage = "斫句迦國周千餘里。國大都城周十餘里，堅峻險固，編戶殷盛。"
summary = "Cakuka is more than 1,000 li round; its capital, more than 10 li round, is strongly defended and populous."

[[stages]]
place = "khotan"
cite = "Book 12, Khotan"
passage = "瞿薩旦那國周四千餘里，沙磧太半，壤土隘狹。宜穀稼，多眾果。"
summary = "Khotan is more than 4,000 li round, more than half of it sand and stones, with little arable soil; it grows grain and many fruits."
